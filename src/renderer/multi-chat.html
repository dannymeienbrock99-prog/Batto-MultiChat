<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Batto Multi-Chat</title>
  <link rel="stylesheet" href="./multi-chat.css">
</head>
<body>
  <div id="multi-chat-root">

      <div style="width:min(460px,calc(100% - 40px));padding:24px;border:1px solid #223044;border-radius:12px;background:#0c121c;box-shadow:0 18px 60px #0008">

      </div>
    </div>
  </div>
  <script src="./renderer-boot-guard.js"></script>
  <script src="./multi-chat.js"></script>
  <script src="./hologram-controls.js"></script>
  <script src="./tiktok-live-tools.js"></script>
  <script src="./euler-account-tools.js"></script>
